<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ViTrox Kiosk — Tech Blue Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#00529B; --blue-deep:#003B70; --blue-ink:#002649;
    --white:#FFFFFF; --surface:#F3F7FF; --line:#DCE6F7; --text-dim:#5B6B84;
    --warm:#FF7A45; --good:#22C08A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Inter',sans-serif;}
  body{background:var(--blue-ink);color:var(--blue-ink);}
  #kiosk{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--white);}

  .dev-toggle{position:fixed;bottom:10px;right:10px;z-index:400;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:17px;cursor:pointer;box-shadow:0 8px 20px -6px rgba(11,95,255,.6);}
  .dev-hud{position:fixed;top:0;right:0;bottom:0;width:320px;z-index:400;font-family:'Inter',sans-serif;font-size:11.5px;color:#002649;background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 40px -20px rgba(10,42,87,.35);display:none;flex-direction:column;overflow:hidden;}
  .dev-hud.show{display:flex;}
  .dh-head{background:linear-gradient(135deg,var(--blue-ink),var(--blue-deep));color:#fff;padding:16px;flex-shrink:0;}
  .dh-head .t1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;}
  .dh-head .t2{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#9FD4FF;margin-top:2px;}
  .dh-body{flex:1;overflow-y:auto;padding:14px;}
  .dh-section-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;margin:14px 0 6px;}
  .dh-section-label:first-child{margin-top:0;}
  .lead-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;padding:6px 12px;border-radius:100px;}
  .lead-badge.cold{background:#E7EEF9;color:#5B6B84;}
  .lead-badge.warm{background:#FFF2E0;color:#B8720A;}
  .lead-badge.hot{background:#FFE3E0;color:#D9432E;}
  .dh-metric-row{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line);}
  .dh-floor-status{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;}
  .dh-feed{display:flex;flex-direction:column;gap:6px;}
  .dh-feed-item{background:var(--surface);border-radius:8px;padding:7px 9px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#33455E;line-height:1.5;}
  .dh-feed-item b{color:var(--blue-deep);}
  .dh-note{font-size:10px;color:var(--text-dim);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}

  /* ============ WELCOME (Screen 1) ============ */
  #view-WELCOME{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;
    background:
      radial-gradient(circle at 15% 15%, rgba(0,82,155,.45), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(0,82,155,.35), transparent 45%),
      linear-gradient(180deg, rgba(2,10,24,.55) 0%, rgba(0,38,73,.75) 55%, rgba(0,82,155,.85) 100%);
    z-index:10; overflow:hidden;
  }
  .welcome-photo{
    position:absolute;inset:0;background-size:cover;background-position:center 55%;
    animation:kenburns 30s ease-in-out infinite alternate; z-index:-1;
  }
  @keyframes kenburns{0%{transform:scale(1.0);}100%{transform:scale(1.09);}}
  .welcome-video-slot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;z-index:-1;}
  .motion-bg{position:absolute;inset:0;opacity:.5;}
  .motion-bg .line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,#4DA8DA,transparent);width:60%;animation:sweep 6s linear infinite;}
  .motion-bg .line:nth-child(1){top:20%;animation-delay:0s;}
  .motion-bg .line:nth-child(2){top:50%;animation-delay:2s;}
  .motion-bg .line:nth-child(3){top:75%;animation-delay:4s;}
  @keyframes sweep{0%{transform:translateX(-120%);}100%{transform:translateX(120%);}}
  .welcome-content{position:relative;z-index:2;padding:36px 40px;background:rgba(255,255,255,.90);border-radius:26px;box-shadow:0 30px 70px -20px rgba(0,20,40,.45);max-width:640px;margin:0 20px;}
  .welcome-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--blue);letter-spacing:.08em;margin-bottom:18px;}
  #view-WELCOME h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,4.2vw,42px);margin:0 0 12px;font-weight:700;color:var(--blue-ink);}
  #view-WELCOME .subtitle{color:#1A2B3C;font-size:14.5px;max-width:460px;line-height:1.65;margin:0 auto 34px;}
  .welcome-btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:640px;margin:0 auto;}
  .welcome-btn{
    background:var(--surface);border:1px solid var(--line);
    color:var(--blue-ink);padding:18px 22px;border-radius:16px;cursor:pointer;width:170px;
    display:flex;flex-direction:column;align-items:center;gap:9px;transition:all .2s;
  }
  .welcome-btn:hover{background:#E4EEFB;transform:translateY(-3px);}
  .welcome-btn .ic{width:34px;height:34px;}
  .welcome-btn .lbl{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;}
  .welcome-btn .sub2{font-size:10.5px;color:#5B6B84;line-height:1.4;}
  .welcome-btn.primary{background:linear-gradient(135deg,var(--blue),#3B82FF);border-color:transparent;color:#fff;}
  .welcome-btn.primary .sub2{color:#DCEBFF;}
  .welcome-btn.warm{background:linear-gradient(135deg,var(--warm),#ff9a6a);border-color:transparent;color:#fff;}
  .welcome-btn.warm .sub2{color:#FFE7DA;}

  /* ============ SPLIT SHELL ============ */
  .split-shell{position:absolute;inset:0;display:none;flex-direction:row;z-index:5;}
  .split-shell.active{display:flex;}

  .left-panel{
    width:236px;flex-shrink:0;background:linear-gradient(180deg,var(--blue-deep),var(--blue-ink));
    border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:12px;padding:14px 12px;overflow-y:auto;
  }
  .lp-section-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:#7FA8DE;text-transform:uppercase;margin:2px 2px 0;}

  .lang-row{display:flex;gap:6px;}
  .lang-btn{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:7px 4px;cursor:pointer;color:#DCEBFF;font-size:16px;display:flex;align-items:center;justify-content:center;gap:4px;}
  .lang-btn .code{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:#9FC4F5;}
  .lang-btn.active{background:rgba(255,255,255,.22);border-color:#fff;}

  .nav-stack{display:flex;flex-direction:column;gap:5px;}
  .nav-btn2{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 11px;cursor:pointer;color:#DCEBFF;font-size:12.5px;font-family:'Inter',sans-serif;text-align:left;}
  .nav-btn2 svg{width:16px;height:16px;flex-shrink:0;}
  .nav-btn2:hover{background:rgba(255,255,255,.1);}
  .nav-btn2.active{background:#fff;border-color:#fff;color:var(--blue-deep);font-weight:600;}

  .cart-btn{position:relative;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 11px;cursor:pointer;color:#fff;font-size:12.5px;}
  .cart-btn svg{width:17px;height:17px;}

  .quiz-btn{background:linear-gradient(135deg,var(--warm),#ff9a6a);border:none;border-radius:10px;padding:11px 12px;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;animation:glow 1.8s ease-in-out infinite;}
  .quiz-btn svg{width:15px;height:15px;}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,122,69,.55);}50%{box-shadow:0 0 0 9px rgba(255,122,69,0);}}

  .lp-spacer{flex:1;min-height:6px;}

  .ticker-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 0;overflow:hidden;position:relative;height:34px;display:flex;align-items:center;cursor:pointer;}
  .ticker-live{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:8.5px;color:#fff;background:var(--warm);padding:2px 6px;border-radius:5px;margin:0 8px;letter-spacing:.05em;}
  .ticker-track{white-space:nowrap;font-size:11px;color:#DCEBFF;font-family:'Inter',sans-serif;animation:tickerScroll 16s linear infinite;padding-left:100%;}
  @keyframes tickerScroll{ from{transform:translateX(0);} to{transform:translateX(-100%);} }

  .staff-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,92,108,.16);border:1px solid rgba(255,92,108,.45);border-radius:10px;padding:10px 11px;cursor:pointer;color:#FFD3D8;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;}
  .staff-btn svg{width:15px;height:15px;}

  /* ---- Main area ---- */
  .main-area{flex:1;background:var(--surface);color:var(--blue-ink);overflow-y:auto;position:relative;padding:30px;}

  /* ============ AI ASSISTANT ============ */
  .assist-launcher{position:fixed;right:24px;bottom:24px;display:flex;align-items:center;gap:12px;z-index:150;}
  .assist-cta{background:#fff;border:1px solid var(--line);padding:9px 16px 9px 9px;border-radius:100px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 28px -12px rgba(10,42,87,.4);cursor:pointer;}
  .assist-cta .avatar-sm{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #004B8D, var(--blue-ink) 70%);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  .assist-cta .avatar-sm svg{width:24px;height:24px;}
  .assist-cta .ring{position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(11,95,255,.5);animation:pulse 2.4s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.85);opacity:.7;}100%{transform:scale(1.35);opacity:0;}}
  .assist-cta .txt .t1{font-size:12.5px;font-weight:600;color:var(--blue-ink);}
  .assist-cta .txt .t2{font-size:10.5px;color:var(--blue);font-family:'JetBrains Mono',monospace;letter-spacing:.04em;}

  /* Modals */
  .modal-backdrop{position:fixed;inset:0;background:rgba(6,20,46,.55);z-index:300;display:none;align-items:center;justify-content:center;}
  .modal-backdrop.active{display:flex;}
  .modal-card{background:#fff;color:var(--blue-ink);border-radius:18px;padding:22px;width:360px;max-width:calc(100vw - 40px);position:relative;}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--text-dim);cursor:pointer;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>

    <div class="welcome-content" id="welcomeContent">
      <div class="welcome-logo">VITROX INTERACTIVE SHOWROOM</div>
      <h1>Welcome to ViTrox</h1>
      <p class="subtitle">Discover how AI-powered inspection solutions transform semiconductor and electronics manufacturing.</p>
      <div class="welcome-btn-row">
        <div class="welcome-btn primary" id="btnExplore">
          <div class="lbl">Explore Products</div>
          <div class="sub2">Browse Business Units</div>
        </div>
      </div>
    </div>

  <!-- MAIN KIOSK SHELL -->

    <div class="left-panel">
      <div class="lp-section-label">Navigate</div>

        <button class="nav-btn2 active">Home View</button>
      </div>
    </div>
    <div class="main-area" id="mainArea">
      <h2>Select an Area</h2>
      <p>Interactive demonstration content loaded successfully.</p>
    </div>
  </div>
</div>

<!-- AI ASSISTANT LAUNCHER -->

  <div class="assist-cta" id="assistCta">

      <div class="ring"></div>

    </div>
    <div class="txt">
      <div class="t1">Click to start</div>
      <div class="t2">ASK VITROX AI</div>
    </div>
  </div>
</div>

<script>
  // Simple view switcher fix
  document.getElementById('btnExplore').addEventListener('click', function() {
    document.getElementById('view-WELCOME').style.display = 'none';
    document.getElementById('splitShell').classList.add('active');
  });
</script>
