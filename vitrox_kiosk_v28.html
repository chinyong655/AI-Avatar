<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViTrox Kiosk Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #001018; }

    /* 全局页面容器 */
    .view-section { display: none; width: 100vw; height: 100vh; position: relative; }
    .view-section.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* Welcome 页面布局 */
    #view-WELCOME {
      position: absolute;
      inset: 0;
      z-index: 10;
      text-align: center;
      background: radial-gradient(circle at 15% 15%, rgba(0,82,155,.45), transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(0,82,155,.35), transparent 45%),
                  linear-gradient(180deg, rgba(2,10,24,.55) 0%, rgba(0,38,73,.75) 55%, rgba(0,82,155,.85) 100%);
    }

    /* 视频背景定位 */
    .welcome-video-slot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      z-index: 1;
    }

    /* 遮罩及卡片 */
    .video-overlay { position: absolute; inset: 0; background: rgba(2, 10, 24, 0.45); z-index: 2; }
    .welcome-card {
      position: relative;
      z-index: 3;
      padding: 36px 40px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 26px;
      box-shadow: 0 30px 70px -20px rgba(0,20,40,.45);
      max-width: 640px;
      margin: 0 20px;
      backdrop-filter: blur(10px);
    }

    /* 按钮基础样式 */
    .btn-group { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
    .kiosk-btn {
      border: none;
      padding: 16px 20px;
      border-radius: 16px;
      cursor: pointer;
      width: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s;
    }
    .kiosk-btn:hover { transform: translateY(-3px); }
    .btn-blue { background: linear-gradient(135deg, #00529B, #3B82FF); color: #fff; }
    .btn-white { background: #ffffff; border: 1px solid #DCE6F7; color: #001A36; }
    .btn-orange { background: linear-gradient(135deg, #FF7A45, #ff9a6a); color: #fff; }

    /* 通用 Home 视图兜底样式 */
    #view-HOME { background: #f4f7fa; color: #333; }
  </style>
</head>
<body>

  <!-- WELCOME VIEW -->
  <div id="view-WELCOME" class="view-section active">
    
    <!-- 视频 Avatar -->
    <video autoplay muted loop playsinline class="welcome-video-slot">
      <source src="seedance_video_avatar.mp4" type="video/mp4">
    </video>

    <!-- 半透明黑蓝遮罩 -->
    <div class="video-overlay"></div>

    <!-- 内容卡片 -->
    <div class="welcome-card">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#00529B; letter-spacing:0.08em; margin-bottom:12px;">
        VITROX KIOSK
      </div>

      <h1 style="font-family:'Space Grotesk',sans-serif; font-size:36px; margin-bottom:12px; font-weight:700; color:#001A36;">
        Welcome to ViTrox
      </h1>

      <p style="color:#1A2B3C; font-size:14.5px; max-width:460px; line-height:1.65; margin: 0 auto;">
        Discover our next-generation automated optical inspection and smart manufacturing solutions.
      </p>

      <div class="btn-group">
        <button class="kiosk-btn btn-blue" onclick="switchPage('HOME')">
          <span style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;">Explore Products</span>
          <span style="font-size:11px; opacity: 0.8;">Showroom & Specs</span>
        </button>

        <button class="kiosk-btn btn-white" onclick="switchPage('SOLUTION')">
          <span style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;">Find Solution</span>
          <span style="font-size:11px; color:#5B6B84;">Guided Match</span>
        </button>

        <button class="kiosk-btn btn-orange" onclick="switchPage('QUIZ')">
          <span style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;">Tech Challenge</span>
          <span style="font-size:11px; opacity: 0.8;">Interactive Quiz</span>
        </button>
      </div>
    </div>

  </div>

  <!-- HOME VIEW (展示区域示例) -->
  <div id="view-HOME" class="view-section">
    <h1>ViTrox Showroom</h1>
    <p>Welcome to the main products dashboard.</p>
    <button class="kiosk-btn btn-blue" onclick="switchPage('WELCOME')" style="margin-top:20px;">Back to Welcome</button>
  </div>

  <script>
    // 简易页面切换函数，防止点击报错
    function switchPage(viewId) {
      document.querySelectorAll('.view-section').forEach(view => {
        view.classList.remove('active');
      });
      const target = document.getElementById('view-' + viewId);
      if (target) {
        target.classList.add('active');
      } else {
        alert("Navigating to " + viewId + " page");
      }
    }
  </script>
</body>
</html>
